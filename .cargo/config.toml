# Windows: link llama.cpp's C++ runtime statically so Sophy Studio runs on PCs
# without the Visual C++ Redistributable (Tauri already links the VC runtime
# statically and uses the UCRT that ships with Windows 10/11).
[env]
LLAMA_STATIC_CRT = "1"
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/msvc-static-runtime.cmake", relative = true }
