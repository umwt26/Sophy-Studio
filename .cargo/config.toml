# Link the whole C/C++ runtime statically on Windows so Sophy Studio runs on PCs
# without the Visual C++ Redistributable. llama.cpp (Prompter AI mode) is C++ and
# would otherwise pull in msvcp140.dll.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
