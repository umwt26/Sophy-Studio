name: Prompter AI probe (Windows)
# Diagnostic: downloads the real model and runs sample requests. test/** only.
on:
  push:
    branches: ["test/**"]
    paths: ["crates/sophy-core/src/prompter_ai.rs", "crates/sophy-core/examples/ai_probe.rs", ".github/workflows/ai-probe.yml", ".cargo/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build probe (release)
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          LLAMA_STATIC_CRT: "1"
        run: |
          cargo build --release -p sophy-core --example ai_probe 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { "BUILD FAILED" | Set-Content ai-probe-result.txt; Get-Content build-log.txt -Tail 80 | Add-Content ai-probe-result.txt }
          exit $code
      - name: Run
        shell: pwsh
        run: |
          python -m pip install --quiet pefile 2>&1 | Out-Null
          $deps = python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); print(' '.join(sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)))" target/release/examples/ai_probe.exe 2>&1
          $out = @("imports: $deps")
          $out += & target/release/examples/ai_probe.exe 2>&1
          $out | Set-Content ai-probe-result.txt -Encoding UTF8
          $out | ForEach-Object { Write-Host $_ }
          (Get-Item target/release/examples/ai_probe.exe).Length | ForEach-Object { "probe exe size: $_" } | Add-Content ai-probe-result.txt
      - name: Publish result to hidden draft
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path ai-probe-result.txt)) { "probe failed before output" | Set-Content ai-probe-result.txt }
          gh release view test-build 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create test-build --draft --prerelease --title "Test build (internal, not for users)" --notes "internal" }
          gh release upload test-build ai-probe-result.txt --clobber
