name: Metadata probe (Windows)
# Diagnostic: what Windows Explorer reads/writes for tagged audio files. test/** only.
on:
  push:
    branches: ["test/**"]
    paths: ["crates/sophy-core/**", ".github/workflows/metadata-probe.yml", ".github/probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build probe
        run: cargo build -p sophy-core --example tag_probe
      - name: Probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = New-Object System.Collections.ArrayList
          function L($m) { [void]$log.Add([string]$m); Write-Host $m }
          function Save { $log | Set-Content probe-result.txt -Encoding UTF8 }
          try { choco install ffmpeg -y --no-progress | Out-Null } catch { L "choco: $_" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $env:Path
          try { Add-Type -Path .github/probe/winprops.cs -ReferencedAssemblies System.Drawing; L "Add-Type OK" } catch { L "Add-Type FAILED: $_" }
          New-Item -ItemType Directory probe -Force | Out-Null
          $P = (Resolve-Path probe).Path
          ffmpeg -v error -y -f lavfi -i "sine=frequency=440:duration=3" -c:a libmp3lame -b:a 192k probe/plain.mp3 2>&1 | % { L "ffmpeg: $_" }
          ffmpeg -v error -y -f lavfi -i "sine=frequency=440:duration=3" -c:a pcm_s16le -ar 44100 -fflags +bitexact probe/plain.wav 2>&1 | % { L "ffmpeg: $_" }
          ffmpeg -v error -y -f lavfi -i "testsrc=s=800x800" -frames:v 1 probe/cover.jpg 2>&1 | % { L "ffmpeg: $_" }
          L ("files: " + ((Get-ChildItem probe | % { $_.Name + '(' + $_.Length + ')' }) -join ', '))
          function Props($name) {
            try {
              $f = (New-Object -ComObject Shell.Application).Namespace($P)
              $it = $f.ParseName($name)
              "Title=" + $f.GetDetailsOf($it, 21) + "; Artists=" + $f.GetDetailsOf($it, 13) + "; Album=" + $f.GetDetailsOf($it, 14)
            } catch { "Props ERR $_" }
          }
          function Dump($f) { try { (python .github/probe/chunks.py dump $f 2>&1) -join ' ' } catch { "dump ERR $_" } }
          Save
          try {
            Copy-Item probe/plain.wav probe/win_written.wav
            L ("win_written set: " + [WinProps]::SetTitleArtist("$P\win_written.wav", "WinTitle", "WinArtist"))
            L ("win_written read: " + (Props "win_written.wav"))
            L ("win_written chunks: " + (Dump probe/win_written.wav))
          } catch { L "win_written ERR $_" }
          Save
          try {
            Copy-Item probe/plain.wav probe/ours.wav
            L ("ours.wav: " + ((& target/debug/examples/tag_probe.exe "$P\ours.wav" probe/cover.jpg 2>&1) -join ' '))
            L ("ours.wav read: " + (Props "ours.wav"))
            L ("ours.wav chunks: " + (Dump probe/ours.wav))
            foreach ($m in @("upper-after","lower-after","upper-before","lower-before")) {
              python .github/probe/chunks.py $m probe/ours.wav "probe/v_$m.wav" 2>&1 | % { L "variant: $_" }
              L ("v_$m read: " + (Props "v_$m.wav") + " | " + (Dump "probe/v_$m.wav"))
            }
          } catch { L "ours ERR $_" }
          Save
          try {
            Copy-Item probe/plain.mp3 probe/ours.mp3
            & target/debug/examples/tag_probe.exe "$P\ours.mp3" probe/cover.jpg | Out-Null
            foreach ($n in @("plain.mp3","ours.mp3","plain.wav","ours.wav","win_written.wav","v_lower-before.wav")) { L ("thumb $n : " + [WinProps]::ThumbInfo("$P\$n")) }
          } catch { L "thumb ERR $_" }
          L ("Windows: " + [Environment]::OSVersion.VersionString)
          Save
      - name: Publish result to hidden draft
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path probe-result.txt)) { "probe step failed" | Set-Content probe-result.txt }
          gh release view test-build 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create test-build --draft --prerelease --title "Test build (internal, not for users)" --notes "internal" }
          gh release upload test-build probe-result.txt --clobber
