name: Build & Release (Windows)

# - Push a tag like v1.2 / v1.2.0  -> builds, verifies the tag matches the app version,
#   and uploads Sophy_Studio_Setup.exe to a DRAFT release. Portable builds never leave the runner.
#   Review the draft, add notes, then press "Publish" — only published releases reach users.
# - Push to a release/** branch -> same, the draft's tag (v<major>.<minor>) is created on publish.
# - Push to a test/** branch or run manually -> build only (installer artifact, no release).

on:
  push:
    tags: ["v*"]
    branches: ["release/**", "test/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify version consistency
        shell: pwsh
        run: |
          $pkg   = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf  = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if ($pkg -ne $conf -or $pkg -ne $cargo) {
            Write-Error "Version mismatch between package.json / tauri.conf.json / src-tauri/Cargo.toml"
            exit 1
          }
          if ("${{ github.ref_type }}" -eq "tag") {
            function Norm([string]$v) {
              $core = ($v.TrimStart('v','V') -split '[-+]')[0]
              $parts = @($core -split '\.' | ForEach-Object { [int]$_ })
              while ($parts.Count -lt 3) { $parts += 0 }
              return ($parts[0..2] -join '.')
            }
            $tag = "${{ github.ref_name }}"
            if ((Norm $tag) -ne (Norm $pkg)) {
              Write-Error "Tag $tag does not match app version $pkg. A release whose installer has an older version than its tag makes every user loop on the update screen."
              exit 1
            }
          }
          "APP_VERSION=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # bump when native build settings change (cached C/C++ objects don't notice)
          key: static-msvc-runtime-1

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        shell: pwsh
        run: |
          "env RUSTFLAGS(before)=[$env:RUSTFLAGS] CARGO_ENCODED_RUSTFLAGS=[$env:CARGO_ENCODED_RUSTFLAGS]" | Set-Content build-log-head.txt
          npx tauri build --bundles nsis 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          Get-Content build-log.txt -Tail 60 | Add-Content build-log-head.txt
          exit $code

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          "collect started" | Set-Content build-diag.txt
          trap { "ERROR: $_" | Add-Content build-diag.txt; break }
          $setup = Get-ChildItem -Path target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "NSIS installer not found"; exit 1 }
          Copy-Item $setup.FullName out/Sophy_Studio_Setup.exe
          Copy-Item target/release/sophy.exe out/Sophy_Studio_Portable.exe
          # Hard guard against the v1.1.5 situation: the binaries themselves must carry APP_VERSION.
          "setup: $($setup.FullName)" | Add-Content build-diag.txt
          foreach ($f in @("out/Sophy_Studio_Setup.exe", "out/Sophy_Studio_Portable.exe")) {
            $pv = (Get-Item $f).VersionInfo.ProductVersion
            "$f ProductVersion=$pv size=$((Get-Item $f).Length)" | Add-Content build-diag.txt
            Write-Host "$f ProductVersion=$pv"
            if (-not $pv -or -not $pv.StartsWith("$env:APP_VERSION")) {
              Write-Error "$f has ProductVersion '$pv', expected $env:APP_VERSION"
              exit 1
            }
          }
          # The app must not depend on the Visual C++ Redistributable (msvcp140/vcruntime140).
          python -m pip install --quiet pefile 2>&1 | Out-Null
          $deps = python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); print(' '.join(sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)))" out/Sophy_Studio_Portable.exe 2>&1
          "imports: $deps" | Add-Content build-diag.txt
          Write-Host "imports: $deps"
          if ($deps -match 'msvcp1|vcruntime1|msvcr1') { "FAIL: VC++ runtime dependency" | Add-Content build-diag.txt; Write-Error "Binary depends on the VC++ runtime: $deps"; exit 1 }
          # Installer hooks must not contain dropper-like commands (antivirus false positives).
          foreach ($nsi in @("src-tauri/hooks.nsh", "src-tauri/installer.nsi")) {
            $text = Get-Content $nsi -Raw
            foreach ($bad in @("powershell", "ExecutionPolicy", "DownloadFile", "taskkill")) {
              if ($text -match [regex]::Escape($bad)) { Write-Error "$nsi contains '$bad'"; exit 1 }
            }
          }
          Get-ChildItem out | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$($_.Name)  $($_.Length) bytes  sha256=$h"
          }

      - uses: actions/upload-artifact@v5
        with:
          name: Sophy-Studio-${{ env.APP_VERSION }}-setup
          path: out/Sophy_Studio_Setup.exe
          retention-days: 7

      - name: Remove internal test-build draft (portable builds are never kept on GitHub)
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-build 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete test-build --yes }
          exit 0

      - name: Upload to draft release
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            # 1.2.0 -> v1.2 ; 1.2.3 -> v1.2.3. The draft's tag is created on this commit when you press Publish.
            $p = $env:APP_VERSION.Split('.')
            $tag = if ($p[2] -eq '0') { "v$($p[0]).$($p[1])" } else { "v$env:APP_VERSION" }
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/Sophy_Studio_Setup.exe --clobber
          } else {
            gh release create $tag out/Sophy_Studio_Setup.exe `
              --target "${{ github.sha }}" --draft --title "Sophy Studio $tag" --notes-file .github/release-notes.md
          }
          # Only the installer is published. Portable builds are never uploaded to GitHub.
